name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate registries
        run: pnpm generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        # Build both apps so CI catches Dockerfile, import-resolution, and
        # Next.js config issues that typecheck alone would miss. The API build
        # is fast (~10s); the Next build is the dominant cost.
        run: pnpm build

      - name: Test
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: typecheck-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @game-studio/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        # 11-C3: pass ENABLE_TEST_ENDPOINTS=true so the test-create
        # consultation endpoint is mounted, and E2E_API_KEY so the
        # bearer auth header resolves against the API_SECRET the
        # playwright config sets. Without these the e2e suite runs
        # but every test that needs the consultation helper returns
        # 404, and auth-gated tests return 401.
        run: pnpm --filter @game-studio/web test:e2e
        env:
          CI: true
          ENABLE_TEST_ENDPOINTS: "true"
          E2E_API_KEY: change_this_to_a_random_secret
